[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-parser-objc"
version = "0.1.0"
description = "Objective-C (.m/.mm/.h) parser plugin for okf-generator, built on tree-sitter-objc"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.23", "tree-sitter-objc>=3.0"]

[project.entry-points."okf.parsers"]
objc = "okf_parser_objc:ObjCParser"

[tool.setuptools.packages.find]
include = ["okf_parser_objc*"]
